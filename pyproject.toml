[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length handled by formatter where it matters; don't block CI on docstrings/comments

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# Full strict mode is a future goal (per AGENTS.md: "Type hints required").
# Starting permissive to avoid blocking CI while the codebase is still small;
# tighten incrementally as modules stabilize.

name: Short-side walk-forward 4h (public Binance klines, research only)

# Pre-registered study: docs/PREREG_SHORT_4H.md. Mirror of tendencia's 4h trend
# logic on the short side, futures-like costs, section 45 walk-forward.
# - Data: data-api.binance.vision public klines. No account, no API key, no orders.
# - Symbols: config/live_limits.json allowed_symbols, plus PAXGUSDT (added in code).
# - Results: the job summary (Actions tab) and the "short-side-4h" artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: short-side-walk-forward
  cancel-in-progress: false

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (no exchange client, no credentials)
        run: pip install "pandas>=2.0" "numpy>=1.24" "scipy>=1.11"
      - name: Short-side walk-forward
        shell: bash  # -eo pipefail: a failed analysis must not hide behind tee
        run: |
          SYMBOLS=$(python -c "import json; print(' '.join(json.load(open('config/live_limits.json'))['allowed_symbols']))")
          python -m trading_intelligence.backtesting.short_side_validation \
            --symbols $SYMBOLS --workers "$(nproc)" --out results \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-side-4h
          path: results
          retention-days: 90
          if-no-files-found: ignore

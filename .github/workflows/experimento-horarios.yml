name: Experimento horarios (daily, public data, PAPER only)

# Pre-registered: docs/PREREG_HORARIOS.md. Replays a complete UTC day of 2-hour windows on
# 20-minute bars for 13 symbols x {tendencia, rango, baseline}, long-only spot, 10 USDT per
# trade. Public data-api.binance.vision klines: no account, no API key, no orders, no secrets.
# Commits only docs/experimento_horarios/ (daily <date>.json/.md + resumen).
# Forward 2026-10-10 -> 2026-10-23 decides; earlier days are "referencia: datos pasados".

on:
  schedule:
    - cron: "20 0 * * *"   # 00:20 UTC: replays the previous UTC day
  workflow_dispatch:
    inputs:
      start:
        description: "First UTC date (YYYY-MM-DD); empty = yesterday"
        required: false
        default: ""
      end:
        description: "Last UTC date, inclusive (YYYY-MM-DD); empty = start"
        required: false
        default: ""

permissions:
  contents: write   # only to commit docs/experimento_horarios/

concurrency:
  group: experimento-horarios
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (no exchange client, no credentials)
        run: pip install "pandas>=2.0" "numpy>=1.24" "scipy>=1.11"
      - name: Replay the day(s)
        shell: bash
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          ARGS=()
          if [ -n "$START" ]; then ARGS+=(--start "$START"); fi
          if [ -n "$END" ]; then ARGS+=(--end "$END"); fi
          python -m trading_intelligence.backtesting.experimento_horarios "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the reports
        shell: bash
        run: |
          git config user.name "experimento-horarios[bot]"
          git config user.email "experimento-horarios@users.noreply.github.com"
          git add docs/experimento_horarios
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Experimento horarios: reports $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1

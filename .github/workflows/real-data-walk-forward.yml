name: Real-data walk-forward (public Binance klines, research only)

# Validates the live operator's profiles (tendencia, tendencia_rango) on REAL
# Binance klines, after fees, before more than the pilot amount is risked.
# - Data: data-api.binance.vision public klines. No account, no API key, no orders.
# - Protocol and verdict rules: trading_intelligence/backtesting/real_data_validation.py
#   (fixed before any result was seen). Dates are fixed here so reruns reproduce.
# - Symbols: the owner-approved list in config/live_limits.json.
# - Results: each job's summary (Actions tab) and the "walk-forward-*" artifacts.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-data-walk-forward
  cancel-in-progress: false

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [tendencia, tendencia_rango]
        timeframe: ["1h", "4h"]
        include:
          - timeframe: "1h"
            start: "2024-10-01"
          - timeframe: "4h"
            start: "2022-10-01"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (no exchange client, no credentials)
        run: pip install "pandas>=2.0" "numpy>=1.24" "scipy>=1.11"
      - name: Walk-forward ${{ matrix.profile }} @ ${{ matrix.timeframe }}
        shell: bash  # -eo pipefail: a failed analysis must not hide behind tee
        run: |
          SYMBOLS=$(python -c "import json; print(' '.join(json.load(open('config/live_limits.json'))['allowed_symbols']))")
          python -m trading_intelligence.backtesting.real_data_validation \
            --profile "${{ matrix.profile }}" --timeframe "${{ matrix.timeframe }}" \
            --start "${{ matrix.start }}" --end 2026-10-01 \
            --symbols $SYMBOLS --workers "$(nproc)" --out results \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-forward-${{ matrix.profile }}-${{ matrix.timeframe }}
          path: results
          retention-days: 90
          if-no-files-found: ignore

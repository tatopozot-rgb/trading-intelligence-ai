name: Research package tests (trading_intelligence/)

# Covers the research/backtesting package only (trading_intelligence/, tests/).
# The separate root PAPER runtime has its own manual Windows workflow
# (paper-tests.yml) — these two suites are intentionally not combined.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "trading_intelligence/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # the suite alone takes ~10 min on a runner (two walk-forward tests ≈7 min)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check trading_intelligence/ tests/
      - name: Type check (mypy)
        run: mypy trading_intelligence/
      - name: Tests (pytest)
        run: pytest tests/ -v

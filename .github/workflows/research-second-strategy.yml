name: Segunda estrategia de futuros (investigación, datos públicos)

# Leader's task 2026-10-11: a second futures strategy next to the desk. Fits a small grid on the
# first 60% of 90 days and tests on the last 40% (funding fade, Asia/London breakout, Scout
# momentum), with the desk's sizing, fees and real funding, plus the daily correlation with the
# desk ("mesa"). Public data only: no account, no API key, no orders, no secrets.
# Commits only docs/research/.

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Days of data"
        required: false
        default: "90"

permissions:
  contents: write   # only to commit docs/research/

concurrency:
  group: research-second-strategy
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (no exchange client, no credentials)
        run: pip install "pandas>=2.0" "numpy>=1.24" "scipy>=1.11"
      - name: Research
        shell: bash
        env:
          DIAS: ${{ inputs.dias || '90' }}
        run: python -m trading_intelligence.backtesting.second_strategy --dias "$DIAS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the report
        shell: bash
        run: |
          git config user.name "research[bot]"
          git config user.email "research@users.noreply.github.com"
          git add docs/research
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Segunda estrategia de futuros: informe $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1

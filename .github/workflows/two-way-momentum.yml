name: Two-way momentum (public Binance data, research only)

# Pre-registered study: docs/PREREG_TWO_WAY.md. Time-series momentum long AND short,
# weekly rebalance, futures-like costs with real funding where the public API allows.
# - Data: data-api.binance.vision daily klines; funding from fapi.binance.com or
#   data.binance.vision public files. No account, no API key, no orders.
# - Symbols: config/live_limits.json allowed_symbols, plus PAXGUSDT (added in code).
# - Results: the job summary (Actions tab) and the "two-way-momentum" artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: two-way-momentum
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (no exchange client, no credentials)
        run: pip install "pandas>=2.0" "numpy>=1.24" "scipy>=1.11"
      - name: Two-way momentum study
        shell: bash  # -eo pipefail: a failed analysis must not hide behind tee
        run: |
          SYMBOLS=$(python -c "import json; print(' '.join(json.load(open('config/live_limits.json'))['allowed_symbols']))")
          python -m trading_intelligence.backtesting.two_way_momentum --symbols $SYMBOLS --out results \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-way-momentum
          path: results
          retention-days: 90
          if-no-files-found: ignore

name: Futuros en los dos sentidos (real-data check, PAPER only)

# Owner, 2026-10-10: "No Apruebo los límites de futuros, deben ser analizados ... debe ser mejor
# analizado". Replays the last N days on 5m bars with the live two-way engine's rules for each
# signal variant. Public data-api.binance.vision klines: no account, no API key, no orders, no
# secrets. Commits only docs/two_way_backtest/.

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Days to replay"
        required: false
        default: "30"
  schedule:
    - cron: "40 1 * * 1"   # every Monday 01:40 UTC: the last 30 days again

permissions:
  contents: write   # only to commit docs/two_way_backtest/

concurrency:
  group: futures-two-way-backtest
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (no exchange client, no credentials)
        run: pip install "pandas>=2.0" "numpy>=1.24" "scipy>=1.11"
      - name: Replay
        shell: bash
        env:
          DIAS: ${{ inputs.dias || '30' }}
        run: python -m trading_intelligence.backtesting.two_way_backtest --dias "$DIAS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the report
        shell: bash
        run: |
          git config user.name "futures-backtest[bot]"
          git config user.email "futures-backtest@users.noreply.github.com"
          git add docs/two_way_backtest
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Futuros dos sentidos: real-data check $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1

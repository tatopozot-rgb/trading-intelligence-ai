name: Investigación de estrategias (datos públicos)

# Leader, 2026-10-12: one workflow for every researcher agent. Dispatch it on your own branch with
# the name of your module in trading_intelligence/backtesting/ (it must start with "research_").
# It runs that module with public Binance data and commits only docs/research/ to the same branch.
# No account, no API key, no orders, no secrets.

on:
  workflow_dispatch:
    inputs:
      modulo:
        description: "Module in trading_intelligence/backtesting/, e.g. research_trend"
        required: true
      args:
        description: "Extra arguments for the module, e.g. --dias 365"
        required: false
        default: ""

permissions:
  contents: write   # only to commit docs/research/

concurrency:
  group: research-run-${{ github.ref_name }}-${{ inputs.modulo }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (no exchange client, no credentials)
        run: pip install "pandas>=2.0" "numpy>=1.24" "scipy>=1.11"
      - name: Research
        shell: bash
        env:
          MODULO: ${{ inputs.modulo }}
          ARGS: ${{ inputs.args }}
        run: |
          if [[ ! "$MODULO" =~ ^research_[a-z0-9_]+$ ]]; then echo "modulo must look like research_name"; exit 1; fi
          if [[ ! "$ARGS" =~ ^[A-Za-z0-9_.,=\ -]*$ ]]; then echo "args: letters, digits and - _ . , = only"; exit 1; fi
          read -r -a EXTRA <<< "$ARGS"
          python -m "trading_intelligence.backtesting.${MODULO}" "${EXTRA[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the report
        shell: bash
        env:
          MODULO: ${{ inputs.modulo }}
        run: |
          git config user.name "research[bot]"
          git config user.email "research@users.noreply.github.com"
          git add docs/research
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Investigación ${MODULO}: informe $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
